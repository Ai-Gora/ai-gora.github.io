name: Claude
on:
  issue_comment: { types: [created] }
  pull_request_review_comment: { types: [created] }
  pull_request_review: { types: [submitted] }
  issues: { types: [opened, assigned] }
jobs:
  claude:
    uses: DNP42/.github/.github/workflows/claude.yml@main
    with:
      app-id: ${{ vars.DNPCLAUDE_APP_ID || '5756777' }}
      agent-log-issue: ${{ vars.AGENT_LOG_ISSUE || '' }}
    secrets:
      DNPCLAUDE_PRIVATE_KEY: ${{ secrets.DNPCLAUDE_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
