article: aig-000009
questions:
  - id: q1
    type: single
    prompt: What evidence survives for most Presocratics?
    options: ["Complete books", "Fragments and testimonia in later authors", "Only Plato's dialogues", "Inscriptions"]
    answer: 1
    explain: No complete Presocratic work survives. We depend on quotations and reports in later authors.
    ref: ancient-greek-philosophy#presocratics
    difficulty: 1
    tags: [presocratics, sources]
  - id: q2
    type: multi
    prompt: Which of these thinkers are counted among the Presocratics?
    options: ["Thales", "Heraclitus", "Aristotle", "Democritus"]
    answer: [0, 1, 3]
    explain: Democritus was a younger contemporary of Socrates, but scholars class him with the Presocratic atomists. Aristotle came later.
    ref: ancient-greek-philosophy#presocratics
    difficulty: 2
    tags: [presocratics]
  - id: q3
    type: single
    prompt: Which three authors are the primary sources for Socrates?
    options: ["Plato, Aristotle and Plutarch", "Aristophanes, Xenophon and Plato", "Socrates himself, in his own books", "Protagoras, Plato and Xenophon"]
    answer: 1
    explain: Socrates wrote nothing. The task of finding the historical Socrates in these three sources is called the Socratic problem.
    ref: ancient-greek-philosophy#sophists-socrates
    difficulty: 1
    tags: [socrates, sources]
  - id: q4
    type: true_false
    prompt: In the Theaetetus, the law-court example shows that true belief is enough for knowledge.
    answer: false
    explain: Jurors who are persuaded of a truth have a true belief, but it is too poorly grounded to count as knowledge.
    ref: ancient-greek-philosophy#plato
    difficulty: 2
    tags: [plato, knowledge]
  - id: q5
    type: single
    prompt: For Aristotle, what must ethical virtue be combined with to be fully developed?
    options: ["Divine command", "Practical wisdom (phronesis)", "Wealth", "Fixed rules"]
    answer: 1
    explain: A low-grade form of virtue develops in childhood. Ethical virtue is fully developed only together with practical wisdom.
    ref: ancient-greek-philosophy#aristotle-ethics
    difficulty: 2
    tags: [aristotle, ethics]
