article: aig-000004
questions:
  - id: q1
    type: multi
    prompt: Which of these are among the four main tissue types?
    options: [Epithelial, Connective, Lymphatic, Nervous]
    answer: [0, 1, 3]
    explain: The four main tissue types are epithelial, connective, muscle and nervous. Lymphatic is the name of an organ system, not a tissue type.
    ref: human-anatomy-basics#tissues
    difficulty: 2
    tags: [tissues]
  - id: q2
    type: single
    prompt: Which plane divides the body into front and back parts?
    options: [Sagittal plane, Coronal (frontal) plane, Transverse plane]
    answer: 1
    explain: The coronal or frontal plane runs from side to side and separates anterior from posterior.
    ref: human-anatomy-basics#planes
    difficulty: 2
    tags: [planes, terminology]
  - id: q3
    type: single
    prompt: How many named bones does the adult skeleton usually have?
    options: ["126", "206", "300"]
    answer: 1
    explain: The adult skeleton usually has 206 named bones, 80 axial and 126 appendicular.
    ref: human-anatomy-basics#skeleton
    difficulty: 1
    tags: [skeleton]
