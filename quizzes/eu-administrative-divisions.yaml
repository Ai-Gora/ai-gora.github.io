article: aig-000007
questions:
  - id: q1
    type: single
    prompt: At which NUTS level does the EU define the regions that can get cohesion policy support?
    options: [NUTS 1, NUTS 2, NUTS 3]
    answer: 1
    explain: Eurostat states that the EU defines these regions at NUTS 2 level.
    ref: eu-administrative-divisions#nuts
    difficulty: 2
    tags: [nuts, eu]
  - id: q2
    type: true_false
    prompt: Slovenia has established provinces (pokrajine) as a level of self-government.
    answer: false
    explain: The constitution provides for provinces, but the state has not established them. Municipalities are the only level of local self-government.
    ref: eu-administrative-divisions#slovenia
    difficulty: 1
    tags: [slovenia]
  - id: q3
    type: single
    prompt: How many regions does France have?
    options: ["13", "18", "101"]
    answer: 1
    explain: "France has 18 regions: 13 in metropolitan France and 5 overseas. The number 101 is the number of départements."
    ref: eu-administrative-divisions#examples
    difficulty: 1
    tags: [france, examples]
  - id: q4
    type: single
    prompt: In the table in this article, which EU country has the most first-level units?
    options: [Germany, Slovenia, Cyprus]
    answer: 2
    explain: The table counts 615 municipalities and communities in Cyprus, from the Eurostat list for 2022. Slovenia has 212 municipalities and Germany 16 Länder.
    ref: eu-administrative-divisions#first-level-table
    difficulty: 2
    tags: [table, eu]
